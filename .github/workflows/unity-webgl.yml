# 奪島遠征 v2：Unity WebGL 自動建置 → 發佈到 /island-raid-v2/
# 需要 repo secrets：UNITY_LICENSE（個人版 .ulf 內容）＋ UNITY_EMAIL ＋ UNITY_PASSWORD
# 取得方式見 unity/island-raid/README.md 或 https://game.ci/docs/github/activation
name: unity-webgl-island-raid-v2

on:
  push:
    branches: [main]
    paths:
      - 'unity/island-raid/**'
      - '.github/workflows/unity-webgl.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unity-webgl-island-raid-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: unity/island-raid/Library
          key: Library-WebGL-${{ hashFiles('unity/island-raid/Assets/**', 'unity/island-raid/Packages/**', 'unity/island-raid/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/island-raid
          targetPlatform: WebGL
          buildMethod: IslandRaid.EditorTools.BuildScript.BuildWebGL

      - name: Publish to /island-raid-v2/
        run: |
          sudo chown -R "$(id -u):$(id -g)" build
          rm -rf island-raid-v2
          mkdir island-raid-v2
          cp -r build/WebGL/* island-raid-v2/
          # 輸出若巢狀在 WebGL/ 子目錄則攤平
          if [ -d island-raid-v2/WebGL ] && [ ! -f island-raid-v2/index.html ]; then
            mv island-raid-v2/WebGL/* island-raid-v2/
            rmdir island-raid-v2/WebGL
          fi
          test -f island-raid-v2/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add island-raid-v2
          git commit -m "CI: publish island-raid v2 Unity WebGL build" || { echo "no changes"; exit 0; }
          git pull --rebase origin main
          git push origin main
