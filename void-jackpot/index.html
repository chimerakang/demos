<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#020108}
body{font-family:'Noto Sans TC','Chakra Petch',sans-serif;color:#cfe8ff;user-select:none}
#world{position:fixed;inset:0;display:block}
/* v9：掃描線疊層（純靜態 CSS，幾乎零成本的 CRT 質感） */
#scan{position:fixed;inset:0;z-index:15;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(2,4,14,.16) 0 1px,transparent 1px 3px)}

.holo{position:fixed;z-index:20;pointer-events:none;font-family:'Share Tech Mono',monospace}
#hudTop{top:22px;left:50%;transform:translateX(-50%);text-align:center}
#hudTop .t1{font-size:11px;letter-spacing:.8em;text-indent:.8em;color:rgba(120,220,255,.55)}
#hudTop .t2{margin-top:6px;font-family:'Chakra Petch','Noto Sans TC';font-weight:700;
  font-size:clamp(18px,3vw,26px);letter-spacing:.5em;text-indent:.5em;
  color:#eaf6ff;text-shadow:0 0 20px rgba(0,200,255,.6),0 0 60px rgba(160,80,255,.4)}
#hudInfo{bottom:110px;left:50%;transform:translateX(-50%);
  font-size:11px;letter-spacing:.35em;color:rgba(150,180,255,.45);text-align:center;white-space:nowrap}
#verTag{left:26px;bottom:26px;font-size:10px;letter-spacing:.3em;color:rgba(120,160,255,.4)}
#phaseCap{top:14%;left:50%;transform:translateX(-50%);
  font-family:'Chakra Petch','Noto Sans TC';font-weight:600;
  font-size:clamp(14px,2.4vw,20px);letter-spacing:.6em;text-indent:.6em;
  color:rgba(255,120,210,.9);text-shadow:0 0 14px rgba(255,60,180,.7);
  opacity:0;transition:opacity .3s}
#errBox{position:fixed;z-index:99;left:8px;top:8px;max-width:80vw;font:11px monospace;
  color:#ff8;background:rgba(80,0,0,.7);padding:6px 8px;display:none;white-space:pre-wrap}
#ledger{position:fixed;z-index:20;left:26px;top:50%;transform:translateY(-50%);

#ledger .lg-t1{color:#ffe066;text-shadow:0 0 10px rgba(255,220,110,.5)}
#ledger .lg-t2{color:#ff8fd2;text-shadow:0 0 8px rgba(255,60,180,.4)}
#ledger .lg-t3{color:#7fe8ff;text-shadow:0 0 8px rgba(0,230,255,.4)}
#ledger .lg-h{color:rgba(140,230,255,.5);letter-spacing:.4em;margin-bottom:2px}

#sigil{
  position:fixed;z-index:30;bottom:34px;left:50%;transform:translateX(-50%);
  width:74px;height:74px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;

  background:radial-gradient(circle at 50% 35%,rgba(0,230,255,.25),rgba(10,5,30,.85) 70%);
  border:1px solid rgba(0,230,255,.6);
  box-shadow:0 0 24px rgba(0,230,255,.35),inset 0 0 18px rgba(0,230,255,.2);
  transition:transform .2s,box-shadow .25s,opacity .3s}
#sigil::before,#sigil::after{content:"";position:absolute;inset:-9px;border-radius:50%;
  border:1px dashed rgba(0,230,255,.35);animation:sigilSpin 10s linear infinite}
#sigil::after{inset:-18px;border-color:rgba(255,60,180,.25);animation-duration:16s;animation-direction:reverse}
@keyframes sigilSpin{to{transform:rotate(360deg)}}
#sigil:hover{transform:translateX(-50%) scale(1.08)}
#sigil.busy{pointer-events:none;opacity:.35}

#gate{position:fixed;z-index:40;right:26px;top:26px;cursor:pointer;

  color:rgba(140,230,255,.7);padding:10px 14px;

#gate:hover{color:#dffbff;border-color:rgba(0,230,255,.8)}

#uplink{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;

#uplink.open{opacity:1;pointer-events:auto}
.uplinkBox{width:min(560px,90vw);text-align:center}
.uplinkBox .cap{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.6em;text-indent:.6em;

#nameInput{width:100%;min-height:180px;resize:vertical;background:transparent;

.uplinkRow{margin-top:18px;display:flex;gap:22px;justify-content:center;align-items:center;

.uplinkRow input[type=checkbox]{accent-color:#ff3cb4}
.tierNum{width:52px;background:rgba(4,8,24,.6);border:1px solid rgba(0,230,255,.35);
  color:#dffbff;font-family:'Share Tech Mono';font-size:14px;text-align:center;padding:6px 2px;outline:none}
.holoBtn{cursor:pointer;background:none;border:1px solid rgba(0,230,255,.5);color:#bff4ff;

  padding:10px 26px;transition:all .2s}
.holoBtn:hover{background:rgba(0,230,255,.1)}

#goldFrame{position:fixed;inset:0;z-index:44;pointer-events:none;opacity:0;transition:opacity .5s;
  box-shadow:inset 0 0 120px rgba(255,190,60,.35),inset 0 0 30px rgba(255,220,110,.3)}
#goldFrame.on{opacity:1}

#reveal{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;pointer-events:none;opacity:0;transition:opacity .4s}
#reveal.show{opacity:1;pointer-events:auto}
#reveal .rl{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.9em;text-indent:.9em;
  color:#8ff3ff;opacity:0}
#reveal.show .rl{animation:rIn .6s .2s both}
#reveal .tierTag{font-family:'Chakra Petch','Noto Sans TC';font-weight:700;
  font-size:clamp(15px,2.6vw,22px);letter-spacing:.8em;text-indent:.8em;opacity:0;
  padding:8px 22px;border:1px solid currentColor}
#reveal.show .tierTag{animation:rIn .5s .1s both}
#reveal.t3 .tierTag{color:#5be6ff}
#reveal.t2 .tierTag{color:#ff6ec7}
#reveal.t1 .tierTag{color:#ffe066;box-shadow:0 0 24px rgba(255,220,110,.35),inset 0 0 14px rgba(255,220,110,.15)}
#winTxt{font-family:'Chakra Petch','Noto Sans TC';font-weight:900;text-align:center;
  font-size:clamp(46px,11vw,130px);letter-spacing:.04em;padding:0 4vw;max-width:96vw;word-break:break-all;color:#fff}
#reveal.t3 #winTxt{text-shadow:0 0 12px #fff,0 0 30px rgba(0,230,255,1),0 0 90px rgba(0,180,255,.8)}
#reveal.t2 #winTxt{text-shadow:0 0 12px #fff,0 0 30px rgba(255,60,180,1),0 0 90px rgba(200,80,255,.8)}
#reveal.t1 #winTxt{background:linear-gradient(105deg,#ffe066 0%,#fff8d6 18%,#ffd75e 32%,#fffbe8 50%,#ffe066 66%,#ff9f1c 84%,#ffe066 100%);
  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 20px rgba(255,220,110,.95)) drop-shadow(0 0 90px rgba(255,160,0,.6))}
#reveal.show #winTxt{animation:wIn .8s cubic-bezier(.15,1.6,.3,1) both}
/* v9：頭獎金字流光 */
#reveal.t1.show #winTxt{animation:wIn .8s cubic-bezier(.15,1.6,.3,1) both,shimmer 3s linear 1.2s infinite}
@keyframes shimmer{from{background-position:0 0}to{background-position:200% 0}}
@keyframes wIn{0%{transform:scale(.1);opacity:0;filter:blur(20px)}
  55%{transform:scale(1.15);opacity:1;filter:blur(0)}100%{transform:scale(1)}}
#reveal .rc{font-weight:700;font-size:clamp(16px,3vw,24px);letter-spacing:.7em;text-indent:.7em;
  color:#ffd9f0;text-shadow:0 0 16px rgba(255,60,180,.8);opacity:0}
#reveal.show .rc{animation:rIn .6s .5s both}
#reveal .ra{display:flex;gap:22px;margin-top:14px;opacity:0}
#reveal.show .ra{animation:rIn .6s .8s both}
@keyframes rIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

#flash{position:fixed;inset:0;z-index:45;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:fl .7s ease-out}
@keyframes fl{0%{opacity:1}100%{opacity:0}}

@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<canvas id="world"></canvas>

<script>
"use strict";
/* =========================================================
 演出流程：
 idle → charge(靈魂收束) → collide(滿場星球互撞)
      → comet(彗星衝入) → boom(大爆炸+衝擊波)
      → slots(拉霸轉輪減速鎖定 JACKPOT) → reveal
 效能（v9）：
 - 不透明 context（alpha:false）+ desynchronized 提示
 - 靜態背景（夜空/星雲/星野/天際線/霧/暗角）一次烘焙成離屏層
 - 行星球體 / 光束 / 神光射線 / 名字標籤 全部預渲染 sprite
 - 逐幀零 createGradient、零 measureText、粒子陣列原地壓實（零 GC）
 - 自適應畫質：依平均幀時間自動升降 dust 數量與 bloom 層數
========================================================= */
const cv=document.getElementById('world');
const ctx=cv.getContext('2d',{alpha:false,desynchronized:true});
let W=0,H=0,CX=0,CY=0,DPR=1,staticDirty=true;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;CX=W/2;CY=H*.46;
  cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  staticDirty=true; // 靜態背景層在下一幀重建
}
addEventListener('resize',resize);resize();

function makeGlow(color,size=64){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');
  const grad=g.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  grad.addColorStop(0,color);
  grad.addColorStop(.35,color.replace(/[\d.]+\)$/,'0.4)'));
  grad.addColorStop(1,color.replace(/[\d.]+\)$/,'0)'));
  g.fillStyle=grad;g.fillRect(0,0,size,size);
  return c;
}
const SPR={
  cyan:makeGlow('rgba(0,230,255,1)'),
  pink:makeGlow('rgba(255,60,180,1)'),
  violet:makeGlow('rgba(160,80,255,1)'),
  gold:makeGlow('rgba(255,220,110,1)'),
  white:makeGlow('rgba(240,250,255,1)')
};
const SPRKEYS=['cyan','pink','violet'];
const PCOLS=[ // 行星配色 [亮,暗,rgb字串,glow鍵]
  ['#39e6ff','#0a4d66','0,230,255','cyan'],
  ['#ff6ec7','#6a1248','255,60,180','pink'],
  ['#b98cff','#38176e','160,80,255','violet'],
  ['#ffd97a','#7a5a10','255,220,110','gold'],
  ['#7dffcf','#0e5a44','120,255,200','cyan'],
  ['#ff9e6e','#7a3212','255,150,90','pink']
];
const FOV=520;
function proj(x,y,z){const s=FOV/(FOV+z);return {x:CX+x*s,y:CY+y*s,s};}

/* ---- v9 預渲染資產：一次生成，逐幀只做 drawImage ---- */
// 垂直光束 sprite（取代逐幀 createLinearGradient×36）
function makeStreak(rgb,size=64){
  const c=document.createElement('canvas');c.width=8;c.height=size;
  const g=c.getContext('2d');
  const grad=g.createLinearGradient(0,0,0,size);
  grad.addColorStop(0,`rgba(${rgb},1)`);
  grad.addColorStop(1,`rgba(${rgb},0)`);
  g.fillStyle=grad;g.fillRect(0,0,8,size);
  return c;
}
const STREAK={cyan:makeStreak('0,230,255'),pink:makeStreak('255,60,180')};
// 行星球體 sprite：光影漸層 + 緯度紋理帶 + 晨昏線（取代逐幀 createRadialGradient）
function makePlanetSprite(col){
  const S=128,R=S/2-2;
  const c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d');
  const bg=g.createRadialGradient(S/2-R*.35,S/2-R*.4,R*.1,S/2,S/2,R);
  bg.addColorStop(0,'#ffffff');bg.addColorStop(.28,col[0]);bg.addColorStop(1,col[1]);
  g.fillStyle=bg;g.beginPath();g.arc(S/2,S/2,R,0,6.28);g.fill();
  g.save();g.beginPath();g.arc(S/2,S/2,R,0,6.28);g.clip();
  g.globalAlpha=.18;g.fillStyle=col[1];
  for(let i=0;i<3;i++){
    g.beginPath();g.ellipse(S/2,S*.3+i*S*.2,R*1.05,S*.045+i*2.5,-.15,0,6.28);g.fill();
  }
  const sh=g.createRadialGradient(S/2+R*.55,S/2+R*.6,R*.2,S/2,S/2,R*1.4);
  sh.addColorStop(0,'rgba(2,1,10,.5)');sh.addColorStop(.55,'rgba(2,1,10,0)');
  g.globalAlpha=1;g.fillStyle=sh;g.fillRect(0,0,S,S);
  g.restore();
  return c;
}
PCOLS.forEach(col=>col.push(makePlanetSprite(col))); // col[4] = 球體 sprite
// 神光射線 sprite：20 條漸層光束一次烘焙（取代逐幀 createLinearGradient×20）
const RAYSPR=(function(){
  const S=1024,c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d'),L=S/2;
  g.translate(L,L);g.globalCompositeOperation='lighter';
  for(let i=0;i<20;i++){
    const a=i*(6.28/20),lw=5+((i*37)%15);
    const gr=g.createLinearGradient(0,0,Math.cos(a)*L,Math.sin(a)*L);
    gr.addColorStop(0,'rgba(255,232,160,.4)');
    gr.addColorStop(.45,'rgba(255,180,80,.14)');
    gr.addColorStop(1,'rgba(255,180,80,0)');
    g.strokeStyle=gr;g.lineWidth=lw;
    g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a)*L,Math.sin(a)*L);g.stroke();
  }
  return c;
})();
/* ---- v9.1 FX+ 追加資產 ---- */
STREAK.white=makeStreak('240,250,255');
// 極光帶：三條正弦色帶多次疊描模擬柔焦，一次烘焙
const AURORA=(function(){
  const w=1024,h=300,c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  g.globalCompositeOperation='lighter';g.lineCap='round';
  const cols=['0,230,255','160,80,255','255,60,180'];
  for(let i=0;i<3;i++){
    const yc=h*(.28+i*.2),amp=26+i*16;
    for(let pass=0;pass<5;pass++){
      g.lineWidth=18+pass*20;g.globalAlpha=.05;
      g.strokeStyle=`rgb(${cols[i]})`;
      g.beginPath();
      for(let x=0;x<=w;x+=16){
        const y=yc+Math.sin(x*.012+i*2.1)*amp;
        x===0?g.moveTo(x,y):g.lineTo(x,y);
      }
      g.stroke();
    }
  }
  return c;
})();
// 追光燈光錐
const CONE=(function(){
  const w=256,h=512,c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  const grad=g.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'rgba(255,235,170,.55)');
  grad.addColorStop(1,'rgba(255,235,170,0)');
  g.fillStyle=grad;
  g.beginPath();g.moveTo(w/2,0);g.lineTo(0,h);g.lineTo(w,h);g.closePath();g.fill();
  return c;
})();
// 十字光芒星（閃爍用）
const STARSPR=(function(){
  const s=48,c=document.createElement('canvas');c.width=c.height=s;
  const g=c.getContext('2d');
  g.drawImage(SPR.white,s*.3,s*.3,s*.4,s*.4);
  g.globalCompositeOperation='lighter';
  const hg=g.createLinearGradient(0,0,s,0);
  hg.addColorStop(0,'rgba(240,250,255,0)');hg.addColorStop(.5,'rgba(240,250,255,.9)');hg.addColorStop(1,'rgba(240,250,255,0)');
  g.fillStyle=hg;g.fillRect(0,s/2-.8,s,1.6);
  const vg2=g.createLinearGradient(0,0,0,s);
  vg2.addColorStop(0,'rgba(240,250,255,0)');vg2.addColorStop(.5,'rgba(240,250,255,.9)');vg2.addColorStop(1,'rgba(240,250,255,0)');
  g.fillStyle=vg2;g.fillRect(s/2-.8,0,1.6,s);
  return c;
})();
// 閃爍星位置種子（畫面比例座標）
const TWK=[];
for(let i=0;i<26;i++)TWK.push({x:Math.random(),y:Math.random()*.58,ph:Math.random()*6.28,sp:.5+Math.random()*1.3,sz:10+Math.random()*18});
// 名字標籤快取：離屏繪字一次，逐幀縮放 drawImage（省去 measureText / 字型解析 / fillText）
const LABELS=new Map();
function getLabel(name,style){ // style: 'planet' | 'soulF'(前) | 'soulB'(後)
  const key=style+'|'+name;
  let l=LABELS.get(key);
  if(l)return l;
  const px=32,pad=8;
  const c=document.createElement('canvas');
  const g=c.getContext('2d');
  const font=(style==='planet'?'700':'300')+' '+px+"px 'Noto Sans TC','Chakra Petch'";
  g.font=font;
  const tw=Math.ceil(g.measureText(name).width);
  c.width=tw+pad*2;c.height=px+pad*2;
  g.font=font;g.textAlign='center';g.textBaseline='middle';
  if(style==='planet'){
    g.fillStyle='rgba(6,2,16,.85)';g.fillText(name,c.width/2,c.height/2+1.5);
    g.fillStyle='#fff';g.fillText(name,c.width/2,c.height/2);
  }else{

let planets=[];
let PSPANX=560,PSPANY=320; // v9.2：依畫面尺寸反推的行星活動半徑（世界座標）
function spawnPlanets(){
  const pool=getPool();
  // v9.2：以中心深度 z=290 的投影比例反推世界座標範圍，行星真正佈滿整個畫面；
  // 數量隨畫面面積調整（上限依自適應畫質等級遞減，O(n²) 碰撞最多 72 顆仍便宜）
  const sMid=FOV/(FOV+290);
  PSPANX=(W*.5)/sMid*1.12;
  PSPANY=(H*.52)/sMid*1.05;
  const cap=[72,60,48,36][PERF.lvl];
  const N=Math.min(cap,Math.max(30,Math.round(W*H/16000)));
  planets=[];
  for(let i=0;i<N;i++){
    planets.push({
      name:pool[i%pool.length],
      x:(Math.random()-.5)*2*PSPANX,
      y:(Math.random()-.5)*2*PSPANY,
      z:Math.random()*460+60,
      vx:(Math.random()-.5)*3.2,vy:(Math.random()-.5)*3.2,vz:(Math.random()-.5)*2.4,
      r:16+Math.random()*20,             // 大顆行星
      col:PCOLS[i%PCOLS.length],
      ring:Math.random()<.4,             // 四成有行星環
      ringA:Math.random()*.9+.15,        // 環傾角
      spin:Math.random()*6.28
    });
  }
}
function updatePlanets(dt,intensity,grav){
  // 向心引力 + 亂流（v9.2：引力以活動半徑正規化並由 grav 權重控制——
  // collide 前中段 grav≈0 行星維持滿場亂舞，尾段權重拉高才向爆心收攏）
  const g=grav===undefined?1:grav;
  for(const p of planets){
    p.vx+=(-p.x/PSPANX*.6*g)*intensity*dt+(Math.random()-.5)*.22*intensity*dt;
    p.vy+=(-p.y/PSPANY*.38*g)*intensity*dt+(Math.random()-.5)*.22*intensity*dt;
    p.vz+=((290-p.z)*.0012)*intensity*dt+(Math.random()-.5)*.18*intensity*dt;
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    p.spin+=.01*dt;
    // 邊界柔性反彈（跟著畫面範圍走）
    if(Math.abs(p.x)>PSPANX){p.vx-=Math.sign(p.x)*.4*dt;}
    if(Math.abs(p.y)>PSPANY){p.vy-=Math.sign(p.y)*.4*dt;}
    if(p.z<40)p.vz+=.4*dt; if(p.z>560)p.vz-=.4*dt;
    const spd=Math.hypot(p.vx,p.vy,p.vz),maxS=4.5+intensity*5;
    if(spd>maxS){const k=maxS/spd;p.vx*=k;p.vy*=k;p.vz*=k;}
  }
  // 兩兩碰撞（N≤40，O(n²) 無壓力）
  for(let i=0;i<planets.length;i++)for(let j=i+1;j<planets.length;j++){
    const a=planets[i],b=planets[j];
    const dx=b.x-a.x,dy=b.y-a.y,dz=b.z-a.z;
    const d=Math.hypot(dx,dy,dz),minD=a.r+b.r;
    if(d<minD&&d>0){
      const nx=dx/d,ny=dy/d,nz=dz/d;
      const overlap=(minD-d)/2;
      a.x-=nx*overlap;a.y-=ny*overlap;a.z-=nz*overlap;
      b.x+=nx*overlap;b.y+=ny*overlap;b.z+=nz*overlap;
      const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny+(b.vz-a.vz)*nz;
      if(rel<0){
        const imp=-rel*.9;
        a.vx-=nx*imp;a.vy-=ny*imp;a.vz-=nz*imp;
        b.vx+=nx*imp;b.vy+=ny*imp;b.vz+=nz*imp;
        // 撞擊火花
        if(intensity>.15&&Math.abs(rel)>1.2){
          const mp=proj((a.x+b.x)/2,(a.y+b.y)/2,(a.z+b.z)/2);
          if(mp.s>0)impactSpark(mp.x,mp.y,Math.min(8,2+Math.abs(rel)));
          rattle();
        }
      }
    }
  }
}
function drawPlanet(p,dim){
  const pr=proj(p.x,p.y,p.z);
  if(pr.s<=0)return;
  const rad=Math.max(4,p.r*pr.s);
  // v9.1：運動殘影（沿速度反方向補一枚淡 glow，高速時產生拖尾感）

  }
  ctx.globalAlpha=.55*dim;
  const gsz=rad*3.4;
  ctx.drawImage(SPR[p.col[3]],pr.x-gsz/2,pr.y-gsz/2,gsz,gsz);
  // 行星環（後半）
  if(p.ring){
    ctx.globalAlpha=.5*dim;
    ctx.strokeStyle=`rgba(${p.col[2]},.7)`;
    ctx.lineWidth=Math.max(1,rad*.1);
    ctx.beginPath();
    ctx.ellipse(pr.x,pr.y,rad*1.9,rad*1.9*p.ringA*.3,p.spin*.2,Math.PI,Math.PI*2);
    ctx.stroke();
  }
  // 球體（v9：預渲染 sprite，含紋理帶與晨昏線）
  ctx.globalAlpha=dim;
  ctx.drawImage(p.col[4],pr.x-rad,pr.y-rad,rad*2,rad*2);
  // 行星環（前半）
  if(p.ring){
    ctx.globalAlpha=.7*dim;
    ctx.strokeStyle=`rgba(${p.col[2]},.85)`;
    ctx.lineWidth=Math.max(1,rad*.12);
    ctx.beginPath();
    ctx.ellipse(pr.x,pr.y,rad*1.9,rad*1.9*p.ringA*.3,p.spin*.2,0,Math.PI);
    ctx.stroke();
  }
  // 名字（v9：預渲染標籤快取）
  const fs=rad*.55;
  if(fs>=8){
    const l=getLabel(p.name,'planet');
    let sc=fs/l.px;
    if(l.tw*sc>rad*1.7)sc=rad*1.7/l.tw;
    ctx.drawImage(l.c,pr.x-l.w*sc/2,pr.y-l.h*sc/2,l.w*sc,l.h*sc);
  }
  ctx.globalAlpha=1;
}

function setupReel(){

}
const easeOutQuart=t=>1-Math.pow(1-t,4);
function drawSlots(T,now){
  const D=curTier().slots;
  const p=Math.min(1,CORE.t/D);
  // 滾動位置
  if(!REEL.slammed){
    REEL.pos=REEL.dist*easeOutQuart(p);
    if(p>=1){REEL.slammed=true;REEL.slamT=now;slamFx();}
  }
  // 轉輪 tick 音
  const idx=Math.floor(REEL.pos);
  if(idx!==REEL.tickIdx&&!REEL.slammed){
    REEL.tickIdx=idx;
    tickSfx(1700+(1-p)*1700);
  }

  const fw=Math.min(540,W*.88), fh=REEL.itemH*3+34;
  const fx=CX-fw/2, fy=CY-fh/2;

  // 追光燈（v9.1：機台後方左右擺動的光錐）
  if(FXON){
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<2;i++){
      const swing=Math.sin(T*1.3+i*Math.PI)*.5;
      ctx.save();
      ctx.translate(CX+(i?fw*.38:-fw*.38),fy-46);
      ctx.rotate(swing);
      ctx.globalAlpha=.2;
      ctx.drawImage(CONE,-90,0,180,H*.55);
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }

  // 機框
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(8,4,26,.9)';
  ctx.strokeStyle='rgba(255,220,110,.8)';
  ctx.lineWidth=2.5;
  roundRect(fx,fy,fw,fh,14);ctx.fill();ctx.stroke();
  ctx.strokeStyle='rgba(0,230,255,.4)';
  ctx.lineWidth=1;
  roundRect(fx+5,fy+5,fw-10,fh-10,10);ctx.stroke();

  // 跑馬燈泡（沿框緣追逐閃爍）
  ctx.globalCompositeOperation='lighter';
  const bulbN=26,perim=2*(fw+fh);
  for(let i=0;i<bulbN;i++){
    let d=(i/bulbN)*perim+(T*260)%perim;d%=perim;
    let bx,by;
    if(d<fw){bx=fx+d;by=fy;}
    else if(d<fw+fh){bx=fx+fw;by=fy+(d-fw);}
    else if(d<fw*2+fh){bx=fx+fw-(d-fw-fh);by=fy+fh;}

/* ---- 音效引擎 v2：失真飽和 + 卷積殘響 + 中頻重心（手機喇叭最佳化） ---- */
let actx=null,master=null,revBus=null,distBus=null,noiseBuf=null,muted=false;
function A(){
  if(!actx){
    actx=new (window.AudioContext||window.webkitAudioContext)();
    // 母線：limiter 式壓縮
    const comp=actx.createDynamicsCompressor();
    comp.threshold.value=-10;comp.knee.value=8;comp.ratio.value=12;
    comp.attack.value=.002;comp.release.value=.2;
    master=actx.createGain();master.gain.value=1.25;
    master.connect(comp);comp.connect(actx.destination);
    // 白噪音源
    noiseBuf=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    // 卷積殘響：合成 1.8s 指數衰減脈衝
    const rl=actx.sampleRate*1.8;
    const ir=actx.createBuffer(2,rl,actx.sampleRate);
    for(let ch=0;ch<2;ch++){
      const cd=ir.getChannelData(ch);
      for(let i=0;i<rl;i++)cd[i]=(Math.random()*2-1)*Math.pow(1-i/rl,2.2);
    }
    const conv=actx.createConvolver();conv.buffer=ir;
    revBus=actx.createGain();revBus.gain.value=.4;
    revBus.connect(conv);conv.connect(master);
    // 失真飽和器：tanh 曲線產生諧波，讓手機喇叭「聽得到」低頻
    const shaper=actx.createWaveShaper();
    const N=1024,curve=new Float32Array(N);
    for(let i=0;i<N;i++){const x=i/(N-1)*2-1;curve[i]=Math.tanh(x*3.2);}
    shaper.curve=curve;shaper.oversample='2x';
    distBus=actx.createGain();distBus.gain.value=.7;
    distBus.connect(shaper);shaper.connect(master);
    const distRev=actx.createGain();distRev.gain.value=.5;
    shaper.connect(distRev);distRev.connect(revBus);
  }
  return actx;
}
/* dest：'dry' 直出 / 'dist' 過失真 / wet 送殘響量 0~1 */
function playNoise(dur,g,fType,f0,f1,q,dest,wet){
  if(muted)return;
  try{const a=A(),src=a.createBufferSource();src.buffer=noiseBuf;src.loop=true;
    const flt=a.createBiquadFilter();flt.type=fType;flt.Q.value=q||1;
    flt.frequency.setValueAtTime(Math.max(f0,20),a.currentTime);
    if(f1)flt.frequency.exponentialRampToValueAtTime(Math.max(f1,20),a.currentTime+dur*.9);
    const gn=a.createGain();
    gn.gain.setValueAtTime(g,a.currentTime);
    gn.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);
    src.connect(flt);flt.connect(gn);
    gn.connect(dest==='dist'?distBus:master);
    if(wet){const w=a.createGain();w.gain.value=wet;gn.connect(w);w.connect(revBus);}
    src.start();src.stop(a.currentTime+dur+.05);}catch(e){}
}
function tone(f0,f1,dur,g,type,dest,wet){
  if(muted)return;
  try{const a=A(),o=a.createOscillator(),gn=a.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(Math.max(f0,10),a.currentTime);
    if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(f1,10),a.currentTime+dur*.92);
    gn.gain.setValueAtTime(g,a.currentTime);
    gn.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);
    o.connect(gn);gn.connect(dest==='dist'?distBus:master);
    if(wet){const w=a.createGain();w.gain.value=wet;gn.connect(w);w.connect(revBus);}
    o.start();o.stop(a.currentTime+dur+.05);}catch(e){}
}

function updateCore(dt,now){
  CORE.t+=dt*16.67;
  switch(CORE.mode){
    case 'idle':CORE.energy=Math.max(0,CORE.energy-.01*dt);break;
    case 'charge':
      CORE.energy=Math.min(.4,CORE.energy+.012*dt);

      break;
    case 'collide':{

      if(p>.8)CORE.shake=Math.max(CORE.shake,(p-.8)*8);
      if(CORE.t>D){comet.trail.length=0;whoosh();setMode('comet');}
      break;
    }
    case 'comet':{

      if(CORE.t>920){

      s.a+=s.sp*dt*(1+E*9);
      if(mode==='charge'){s.pull=Math.min(1,s.pull+.022*dt*(1+E));}
      else{s.pull=Math.max(0,s.pull-.03*dt);}
      const r=s.r*(1-s.pull*.96),yy=s.y*(1-s.pull);
      const x=Math.cos(s.a)*r,z=Math.sin(s.a)*r+300*(1-s.pull);
      const p=proj(x,yy,z);
      if(p.s<=0)continue;
      const alpha=(1-s.pull*.9)*Math.min(1,p.s*1.1);
      if(alpha<.03)continue;
      const fs=Math.max(9,15*p.s);
      ctx.globalAlpha=alpha;
      // v9：預渲染名字標籤取代逐幀 font 設定 + fillText
      const l=getLabel(s.name,Math.sin(s.a)>0?'soulF':'soulB');
      const sc=fs/l.px;
      ctx.drawImage(l.c,p.x-l.w*sc/2,p.y-l.h*sc/2,l.w*sc,l.h*sc);
      const gsz=fs*1.4;
      ctx.globalAlpha=alpha*.5;
      ctx.drawImage(SPR.cyan,p.x-gsz/2,p.y-gsz/2,gsz,gsz);
    }
    ctx.globalAlpha=1;
  }

  /* 行星群（collide/comet） */
  if(mode==='collide'||mode==='comet'){
    planets.sort((a,b)=>b.z-a.z); // v9：原地排序，零複製
    for(const p of planets)drawPlanet(p,1);
  }

  /* 彗星 */
  if(mode==='comet'){
    const p=Math.min(1,CORE.t/920);
    const c=cometPos(p);
    comet.trail.push({x:c.x,y:c.y,z:c.z});
    if(comet.trail.length>16)comet.trail.shift();
    // 尾焰
    for(let i=0;i<comet.trail.length;i++){
      const t2=comet.trail[i];
      const pr=proj(t2.x,t2.y,t2.z);
      if(pr.s<=0)continue;
      const k=i/comet.trail.length;
      const sz=(10+k*70)*pr.s;
      ctx.globalAlpha=k*.7;
      ctx.drawImage(k>.7?SPR.white:SPR.gold,pr.x-sz/2,pr.y-sz/2,sz,sz);
    }
    // 彗核 + 鏡頭光斑
    const pr=proj(c.x,c.y,c.z);
    if(pr.s>0){
      const sz=90*pr.s;
      ctx.globalAlpha=1;
      ctx.drawImage(SPR.white,pr.x-sz/2,pr.y-sz/2,sz,sz);
      ctx.drawImage(SPR.gold,pr.x-sz*.8,pr.y-sz*.8,sz*1.6,sz*1.6);
      // 各向異性光斑（橫向拉伸）
      ctx.save();
      ctx.translate(pr.x,pr.y);ctx.scale(7,.5);
      ctx.globalAlpha=.55;
      ctx.drawImage(SPR.white,-sz/2,-sz/2,sz,sz);
      ctx.restore();
      // 鬼影往畫面中心排列
      for(let gi=1;gi<=2;gi++){
        const gx=pr.x+(CX-pr.x)*gi*.45, gy=pr.y+(CY-pr.y)*gi*.45;
        const gs=sz*(0.35-gi*.1);
        ctx.globalAlpha=.3/gi;
        ctx.drawImage(SPR.gold,gx-gs/2,gy-gs/2,gs,gs);
      }
      ctx.globalAlpha=1;
    }
    ctx.globalAlpha=1;
    CORE.shake=Math.max(CORE.shake,p*6);
    // v9.1：與彗星同向的高速速度線，強化俯衝呼嘯感
    if(FXON&&Math.random()<.5*dt){
      meteors.push({x:W*.55+Math.random()*W*.55,y:-20+Math.random()*H*.35,
        vx:-10-Math.random()*5,vy:7+Math.random()*3,
        len:120+Math.random()*120,life:1,decay:.02});
    }
  }

  /* 衝擊波（v9：原地壓實，零 filter 配置） */
  if(rings.length){
    let rn=0;
    for(const r of rings){
      r.r+=r.v*dt;r.life-=r.decay*dt;
      if(r.life<=0)continue;
      rings[rn++]=r;
      ctx.globalAlpha=r.life*.8;
      ctx.strokeStyle=r.gold?'rgba(255,220,110,1)':'rgba(200,240,255,1)';
      ctx.lineWidth=r.gold?5:2.5;
      ctx.beginPath();ctx.arc(CX,CY,r.r,0,6.28);ctx.stroke();
    }
    rings.length=rn;
    ctx.globalAlpha=1;
  }

  /* 神光射線 + 爆心光球（v9：射線改為預渲染 sprite 旋轉繪製，原本每幀 20 個漸層） */
  if(boomLight>.01){
    const k=boomLight;
    const L=Math.hypot(W,H);
    ctx.save();
    ctx.translate(CX,CY);ctx.rotate(rayAng+(1-k)*.18);
    ctx.globalAlpha=k;
    ctx.drawImage(RAYSPR,-L,-L,L*2,L*2);
    ctx.restore();
    const ls=(360+(1-k)*700)*k+120;
    ctx.globalAlpha=k*.85;
    ctx.drawImage(SPR.gold,CX-ls/2,CY-ls/2,ls,ls);
    ctx.globalAlpha=k*.6;
    ctx.drawImage(SPR.white,CX-ls*.3,CY-ls*.3,ls*.6,ls*.6);
    ctx.globalAlpha=1;
    boomLight*=Math.pow(.965,dt);
  }

  /* 拉霸機 */
  if(mode==='slots')drawSlots(T,now);

  /* 爆炸粒子（v9：原地壓實，零 filter 配置 → 零 GC 突刺） */
  if(sparks.length){
    let sn=0;
    for(const p of sparks){
      p.vy+=.16*dt;p.vx*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=p.decay*dt;
      if(p.life<=0)continue;
      sparks[sn++]=p;
      ctx.globalAlpha=p.life;
      ctx.drawImage(SPR[p.k],p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);
    }
    sparks.length=sn;
    ctx.globalAlpha=1;
  }

  /* v9.1：餘燼／螢火（爆後緩升殘留；開獎時持續自底部上飄） */
  if(FXON&&mode==='reveal'&&Math.random()<.2*dt)
    spawnEmbers(1,CX+(Math.random()-.5)*W*.6,H*.8+Math.random()*H*.15,30);
  if(embers.length){
    let en=0;
    for(const e of embers){
      e.ph+=.1*dt;
      e.x+=e.vx*dt+Math.sin(e.ph)*.3*dt;e.y+=e.vy*dt;e.life-=e.decay*dt;
      if(e.life<=0||e.y<-30)continue;
      embers[en++]=e;
      ctx.globalAlpha=e.life*(.45+.35*Math.sin(e.ph*1.7)); // 忽明忽暗
      ctx.drawImage(SPR[e.k],e.x-e.sz/2,e.y-e.sz/2,e.sz,e.sz);
    }
    embers.length=en;
    ctx.globalAlpha=1;
  }

  /* 彩帶（v9 頭獎美術強化） */
  if(confetti.length){
    ctx.globalCompositeOperation='source-over';
    let cn=0;
    for(const f of confetti){
      f.vy+=.03*dt;f.ph+=.08*dt;
      f.x+=f.vx*dt+Math.sin(f.ph)*1.2*dt;f.y+=f.vy*dt;
      f.rot+=f.vr*dt;f.life-=f.decay*dt;
      if(f.life<=0||f.y>H+30)continue;
      confetti[cn++]=f;
      ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);
      ctx.scale(1,.35+Math.abs(Math.sin(f.ph))*.65); // 翻面
      ctx.globalAlpha=Math.min(1,f.life*3);
      ctx.fillStyle=f.col;
      ctx.fillRect(-f.w/2,-f.h/2,f.w,f.h);
      ctx.restore();
    }
    confetti.length=cn;
    ctx.globalAlpha=1;
  }

  ctx.restore();

  /* 暗角（v9：預渲染，聚焦視線） */
  ctx.globalCompositeOperation='source-over';
  ctx.drawImage(vignette,0,0,W,H);

  /* Bloom 後處理：降採樣柔化 + 加法疊回（層數隨畫質等級調整） */
  if(Q.bloom>0)applyBloom(.30+CORE.energy*.5+boomLight*.7,Q.bloom);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

const bloomA=document.createElement('canvas'),bA=bloomA.getContext('2d');
const bloomB=document.createElement('canvas'),bB=bloomB.getContext('2d');
function applyBloom(strength,layers){
  if(strength<=0)return;
  const bw=Math.max(2,(W/4)|0),bh=Math.max(2,(H/4)|0);
  if(bloomA.width!==bw||bloomA.height!==bh){
    bloomA.width=bw;bloomA.height=bh;
    bloomB.width=Math.max(2,bw>>1);bloomB.height=Math.max(2,bh>>1);
  }
  bA.globalCompositeOperation='copy';
  bA.drawImage(cv,0,0,bw,bh);
  if(layers>1){
    bB.globalCompositeOperation='copy';
    bB.drawImage(bloomA,0,0,bloomB.width,bloomB.height);
  }
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=Math.min(.8,strength*.5);
  ctx.drawImage(bloomA,0,0,cv.width,cv.height);
  if(layers>1){
    ctx.globalAlpha=Math.min(.8,strength*.62);
    ctx.drawImage(bloomB,0,0,cv.width,cv.height);
  }
  ctx.restore();
}

/* ---- 流程控制 ---- */
const $=id=>document.getElementById(id);
const sigil=$('sigil'),gate=$('gate'),uplink=$('uplink'),uplinkClose=$('uplinkClose'),
      nameInput=$('nameInput'),removeWinner=$('removeWinner'),
      hudInfo=$('hudInfo'),reveal=$('reveal'),winTxt=$('winTxt'),
      againBtn=$('againBtn'),backBtn=$('backBtn'),flash=$('flash');

let winners=[];
function getPool(){
  const won=new Set(removeWinner.checked?winners:[]);
  return [...new Set(nameInput.value.split('\n').map(s=>s.trim()).filter(Boolean))]
    .filter(n=>!won.has(n));
}
function secureRand(max){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%max;}

function startDraw(){
  const pool=getPool();
  if(!pool.length){
    hudInfo.textContent='名單是空的（可能被頁面重載清空）· 請重新輸入';
    uplink.classList.add('open');return;
  }
  if(CORE.mode!=='idle')return;
  advanceTier();
  if(tierIdx>=TIERS.length){
    hudInfo.textContent='所有獎項抽選完畢 · 可在名單層重置';return;
  }
  CORE.winner=pool[secureRand(pool.length)];
  sigil.classList.add('busy');
  hudInfo.textContent='虛空正在凝視……';
  blip(220,.4,.06,'sine');
  setMode('charge');
}

function doReveal(){
  const t=curTier(),grand=(t.key==='t1');
  setMode('reveal');
  CORE.shake=grand?26:16;
  burst(t.sparks,grand,CX,CY-H*.06);
  fanfare();
  if(grand){
    setTimeout(function(){burst(200,true,CX,CY-H*.06);fanfare();},450);
    document.getElementById('goldFrame').classList.add('on');
    spawnConfetti(130); // v9：頭獎彩帶雨
  }
  winners.push(CORE.winner);
  winnersByTier[tierIdx].push(CORE.winner);
  tierDrawn[tierIdx]++;
  winTxt.textContent=CORE.winner;
  reveal.classList.remove('t1','t2','t3');
  reveal.classList.add(t.key);
  $('tierTag').textContent=t.label.split('').join(' ');
  $('revealRl').textContent=t.en+' // THE VOID HAS CHOSEN';
  $('revealRc').textContent=grand?'虛空加冕於你':'恭喜 · '+t.rc;
  renderLedger();
  setTimeout(function(){
    reveal.classList.add('show');
    burst(grand?180:100,grand,CX,CY-H*.06);
  },250);
}

function backToVoid(){
  reveal.classList.remove('show');
  $('goldFrame').classList.remove('on');
  $('phaseCap').style.opacity=0;
  setMode('idle');
  sigil.classList.remove('busy');
  rebuildSouls();
}

/* ---- 持久化 ---- */
function saveState(){try{localStorage.setItem('vj_names',nameInput.value);
  localStorage.setItem('vj_cnt',JSON.stringify(tierCounts()));}catch(e){}}
function loadState(){try{
  const n=localStorage.getItem('vj_names');if(n)nameInput.value=n;
  const c=JSON.parse(localStorage.getItem('vj_cnt')||'null');
  if(c){$('cnt3').value=c[0];$('cnt2').value=c[1];$('cnt1').value=c[2];}
}catch(e){}}
loadState();

sigil.addEventListener('click',startDraw);
againBtn.addEventListener('click',function(){backToVoid();setTimeout(startDraw,350);});
backBtn.addEventListener('click',backToVoid);
gate.addEventListener('click',function(){uplink.classList.add('open');});
uplinkClose.addEventListener('click',function(){uplink.classList.remove('open');rebuildSouls();});
$('resetBtn').addEventListener('click',function(){
  winners=[];winnersByTier=[[],[],[]];tierDrawn=[0,0,0];tierIdx=0;
  renderLedger();rebuildSouls();
});
nameInput.addEventListener('input',function(){saveState();if(CORE.mode==='idle')rebuildSouls();});
removeWinner.addEventListener('change',rebuildSouls);
['cnt3','cnt2','cnt1'].forEach(function(id){$(id)
  .addEventListener('input',function(){saveState();if(CORE.mode==='idle')rebuildSouls();});});
document.getElementById('muteBtn').addEventListener('click',function(){
  muted=!muted;
  this.textContent=muted?'♪ OFF':'♪ ON';
  this.style.color=muted?'rgba(120,120,150,.5)':'rgba(140,230,255,.7)';
});
// v9：分頁切回時重置幀計時，避免 dt 突刺與效能取樣被污染
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){last=performance.now();PERF.acc=0;PERF.n=0;}
});
rebuildSouls();
</script>
