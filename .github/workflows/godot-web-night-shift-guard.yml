# 夜班保全：Godot 4.7 網頁匯出 → 發佈到 /night-shift-guard/
# 來源在 godot/night-shift-guard/。單執行緒匯出，GitHub Pages 不需要 COOP/COEP 標頭。
#
# 模板：不抓整包 1.2 GB 的 .tpz（GitHub 釋出資產常 503/504），
#       用 tools/fetch_web_templates.py 以 HTTP Range 只抽網頁模板（約 20 MB）。
# 字型：CI 下載 Noto Sans TC 並做子集，只留遊戲文本用到的字（約 0.5 MB）。
name: godot-web-night-shift-guard

on:
  push:
    branches: [main]
    paths:
      - 'godot/night-shift-guard/**'
      - '.github/workflows/godot-web-night-shift-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-web-night-shift-guard
  cancel-in-progress: true

env:
  GODOT_TAG: 4.7-stable
  PROJECT_DIR: godot/night-shift-guard
  OUT_DIR: night-shift-guard

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_TAG }} (editor binary)
        run: |
          curl -sSL --retry 5 --retry-all-errors -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv Godot_v${GODOT_TAG}_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Fetch web export templates (ranged, ~20 MB)
        run: python3 "$PROJECT_DIR/tools/fetch_web_templates.py" "$GODOT_TAG"

      - name: Subset CJK font
        run: |
          pip install --quiet fonttools brotli
          curl -sSL --retry 5 --retry-all-errors -o /tmp/NotoSansTC.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanstc/NotoSansTC%5Bwght%5D.ttf"
          cd "$PROJECT_DIR"
          SRC=/tmp/NotoSansTC.ttf ./tools/subset_font.sh
          grep -n "custom_font" project.godot

      - name: Import + smoke test (headless)
        run: |
          cd "$PROJECT_DIR"
          godot --headless --path . --import >/dev/null 2>&1 || true
          godot --headless --path . tools/smoke_test.tscn

      - name: Export Web
        run: |
          cd "$PROJECT_DIR"
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          ls -la build/web
          test -f build/web/index.wasm
          test -f build/web/index.pck

      - name: Publish to /${{ env.OUT_DIR }}/
        run: |
          rm -rf "$OUT_DIR"
          mkdir "$OUT_DIR"
          cp -r "$PROJECT_DIR"/build/web/* "$OUT_DIR"/
          test -f "$OUT_DIR"/index.html
          du -sh "$OUT_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_DIR"
          git commit -m "CI: publish night-shift-guard Godot web build (${GITHUB_SHA::7})" || { echo "no changes"; exit 0; }
          git push
